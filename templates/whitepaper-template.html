<!DOCTYPE html>
<!--
    Whitepaper template

    Generated into one HTML file per chapter by generate_whitepapers.py; the design
    standards are in docs/WHITEPAPER_DESIGN_GUIDELINES.md.

    Design: the whitepaper shares the look of the book's cover and website. The header
    is a cover band (the book's two-tone gradient over the 40 px series grid, an accent
    edge, an uppercase eyebrow and a large chapter number); the body is Inter on white;
    accent colours are used for rules, numbers and the call-to-action button, never for
    text on white. The palette defaults below are the Book 1 cover; the generator
    overrides them from docs/stylesheets/series-colours.css when the book has that file.

    Constraints from the release pipeline:
    - The combined whitepapers PDF is made by stripping the tags from everything between
      the opening and closing body tags, line by line, starting at the first line that
      contains the opening tag. So that opening tag appears only once, every tag stays on
      one line, and decorative text is generated with CSS (pseudo-elements), never
      written into the page.
    - Meets WCAG AA contrast for body text; A4 print layout with a full-bleed first page.
-->
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[PAGE_TITLE]]</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />

    <style>
        :root {
            /* Book palette: defaults are the Book 1 cover, overridden per book below */
            --book-dark: #1F2A3C;
            --book-primary: #1B3A7A;
            --book-strong: #1D4ED8;
            --book-accent: #60A5FA;
            --book-tint: #E6EEFB;
            --book-paper: #F6F8FB;
            /* Neutrals shared by every book */
            --ink: #182033;
            --muted: #4F5B71;
            --rule: #DFE5EE;
            --white: #FFFFFF;
        }
        /* [[PALETTE_OVERRIDE]] */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--book-paper);
            color: var(--ink);
            line-height: 1.65;
            font-size: 16px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .page {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            background: var(--white);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
            overflow: hidden;
        }

        /* Cover band */
        .whitepaper-header {
            position: relative;
            overflow: hidden;
            color: var(--white);
            padding: 20mm 25mm 16mm calc(25mm - 6px);
            border-left: 6px solid var(--book-accent);
            background:
                radial-gradient(60% 90% at 88% 0%, color-mix(in srgb, var(--book-accent) 24%, transparent), transparent 62%),
                radial-gradient(50% 70% at 0% 100%, color-mix(in srgb, var(--book-strong) 50%, transparent), transparent 60%),
                linear-gradient(135deg, var(--book-primary), var(--book-dark));
        }

        .whitepaper-header::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .whitepaper-header::after {
            content: attr(data-chapter-number);
            position: absolute;
            right: 16mm;
            bottom: -12mm;
            font-size: 190px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            color: rgba(255, 255, 255, 0.07);
            pointer-events: none;
        }

        .whitepaper-header > * {
            position: relative;
            z-index: 1;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 26px;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
        }

        .eyebrow::before {
            content: "";
            width: 34px;
            height: 4px;
            border-radius: 2px;
            background: var(--book-accent);
        }

        .kicker {
            margin-bottom: 10px;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--book-accent);
        }

        .title {
            max-width: 90%;
            font-size: 38px;
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: -0.02em;
            color: var(--white);
        }

        .subtitle {
            max-width: 82%;
            margin-top: 14px;
            font-size: 19px;
            font-weight: 400;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.84);
        }

        .subtitle:empty {
            display: none;
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 38px;
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            color: var(--white);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .meta-label {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--book-accent);
        }

        .feature-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }

        .feature-tag {
            display: inline-flex;
            align-items: center;
            padding: 3px 11px;
            border: 1px solid rgba(255, 255, 255, 0.34);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.07);
            color: var(--white);
            font-family: 'JetBrains Mono', Consolas, monospace;
            font-size: 11.5px;
            font-weight: 500;
        }

        /* Body */
        .content {
            padding: 16mm 25mm 8mm 25mm;
        }

        section {
            margin-bottom: 40px;
        }

        h2 {
            margin: 0 0 16px 0;
            font-size: 24px;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.01em;
            color: var(--book-primary);
        }

        h2::before {
            content: "";
            display: block;
            width: 36px;
            height: 4px;
            margin-bottom: 12px;
            border-radius: 2px;
            background: var(--book-accent);
        }

        h3 {
            margin: 24px 0 12px 0;
            font-size: 19px;
            font-weight: 700;
            line-height: 1.35;
            color: var(--book-primary);
        }

        p {
            margin-bottom: 16px;
            color: var(--ink);
        }

        strong {
            font-weight: 700;
        }

        a {
            color: var(--book-strong);
        }

        .lead {
            padding-left: 18px;
            border-left: 4px solid var(--book-accent);
            font-size: 17.5px;
            line-height: 1.6;
            color: var(--ink);
        }

        ul, ol {
            margin: 16px 0;
            padding-left: 24px;
        }

        li {
            margin-bottom: 8px;
            color: var(--ink);
        }

        code {
            padding: 1px 6px;
            border-radius: 4px;
            background: var(--book-tint);
            color: var(--book-primary);
            font-family: 'JetBrains Mono', Consolas, monospace;
            font-size: 0.88em;
        }

        pre,
        pre[class*="language-"] {
            margin: 16px 0;
            padding: 16px;
            overflow-x: auto;
            border-left: 4px solid var(--book-accent);
            border-radius: 8px;
            background: var(--book-dark) !important;
        }

        pre code,
        code[class*="language-"] {
            padding: 0;
            background: none;
            color: #E5E7EB;
            font-size: 14px;
            line-height: 1.5;
        }

        .line-numbers .line-numbers-rows {
            border-right: 1px solid rgba(255, 255, 255, 0.25);
        }

        .callout {
            margin: 22px 0;
            padding: 18px 22px;
            border-left: 5px solid var(--book-strong);
            border-radius: 8px;
            background: var(--book-tint);
        }

        .callout-title {
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--book-primary);
        }

        .callout p:last-child {
            margin-bottom: 0;
        }

        .chapter-figure {
            margin: 26px 0;
            padding: 14px;
            border: 1px solid var(--rule);
            border-radius: 10px;
            background: var(--white);
        }

        .chapter-figure img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
        }

        .chapter-figure figcaption {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--rule);
            font-size: 13px;
            line-height: 1.45;
            color: var(--muted);
        }

        .topics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            margin: 18px 0 0 0;
            padding: 0;
            list-style: none;
            counter-reset: topic;
        }

        .topics li {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 0;
            padding: 12px 14px;
            border-radius: 8px;
            background: var(--book-tint);
            font-size: 15px;
            font-weight: 500;
            line-height: 1.35;
            counter-increment: topic;
        }

        .topics li::before {
            content: counter(topic, decimal-leading-zero);
            font-size: 13px;
            font-weight: 800;
            color: var(--book-strong);
        }

        .book-overview {
            padding: 24px 28px;
            border: 1px solid var(--rule);
            border-left: 6px solid var(--book-accent);
            border-radius: 10px;
            background: var(--book-paper);
        }

        .book-overview .callout {
            margin-bottom: 0;
            background: var(--white);
        }

        .call-to-action {
            position: relative;
            overflow: hidden;
            padding: 28px 32px;
            border-radius: 12px;
            color: var(--white);
            background:
                radial-gradient(60% 90% at 90% 0%, color-mix(in srgb, var(--book-accent) 22%, transparent), transparent 62%),
                linear-gradient(135deg, var(--book-primary), var(--book-dark));
        }

        .call-to-action h2,
        .call-to-action p,
        .call-to-action strong {
            color: var(--white);
        }

        .call-to-action p {
            color: rgba(255, 255, 255, 0.88);
        }

        .call-to-action p:last-child {
            margin-bottom: 0;
        }

        .button {
            display: inline-block;
            margin-bottom: 18px;
            padding: 11px 20px;
            border-radius: 8px;
            background: var(--book-accent);
            color: var(--book-dark);
            font-weight: 700;
            text-decoration: none;
        }

        .whitepaper-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 6px 24px;
            padding: 11mm 25mm;
            border-top: 4px solid var(--book-accent);
            background: var(--book-dark);
            color: rgba(255, 255, 255, 0.82);
            font-size: 12.5px;
            line-height: 1.5;
        }

        .whitepaper-footer strong,
        .whitepaper-footer a {
            color: var(--white);
        }

        @page {
            size: A4;
            margin: 18mm 0;
        }

        @page :first {
            margin: 0;
        }

        @media print {
            body {
                background: var(--white);
            }

            .page {
                width: auto;
                min-height: 0;
                box-shadow: none;
            }

            h2,
            h3 {
                break-after: avoid;
            }

            .chapter-figure,
            .callout,
            .topics li,
            .call-to-action,
            .book-overview,
            pre {
                break-inside: avoid;
            }
        }

        @media (max-width: 768px) {
            .page {
                width: 100%;
            }

            .whitepaper-header {
                padding: 36px 22px 30px 20px;
            }

            .whitepaper-header::after {
                font-size: 120px;
                right: 10px;
            }

            .title,
            .subtitle {
                max-width: 100%;
            }

            .title {
                font-size: 29px;
            }

            .content {
                padding: 28px 22px 8px 22px;
            }

            .topics {
                grid-template-columns: 1fr;
            }

            .meta-info {
                flex-direction: column;
                gap: 12px;
            }

            .whitepaper-footer {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="whitepaper-header" data-chapter-number="[[CHAPTER_NUMBER]]">
            <p class="eyebrow">[[EYEBROW]]</p>
            <p class="kicker">[[CATEGORY]]</p>
            <h1 class="title">[[TITLE]]</h1>
            <p class="subtitle">[[SUBTITLE]]</p>
            <div class="meta-info">
                <div class="meta-item">
                    <span class="meta-label">Author</span>
                    <span>[[AUTHOR]]</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Published</span>
                    <span>[[DATE]]</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Build number</span>
                    <span>[[VERSION]]</span>
                </div>
            </div>
            <!-- FEATURE_TAGS -->
        </header>

        <main class="content">
        <!-- WHITEPAPER_CONTENT -->
        </main>

        <footer class="whitepaper-footer">
            <span>[[FOOTER_LEFT]]</span>
            <span>[[FOOTER_RIGHT]]</span>
        </footer>
    </div>

    <!-- Prism.js core and plugins for syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

    <!-- Language support for common languages in the book -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-docker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-terraform.min.js"></script>
</body>
</html>
