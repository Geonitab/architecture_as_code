name: Claude PR follow-up scan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-pr-followups-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: Geonitab/Internal/.github/workflows/claude-pr-followups-reusable.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit