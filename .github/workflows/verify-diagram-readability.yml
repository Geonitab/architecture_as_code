name: Verify Diagram Readability

# A diagram is shown at about 800 px wide. `bookengine run validate_diagram_readability` measures the rendered PNG
# (at most 1,800 px wide and 1.8 : 1), the labels (at most 7 words and 45 characters) and the number of boxes (at most 12);
# the limits are in docs/DIAGRAM_STYLE_GUIDE.md.

on:
  pull_request:
    branches: [main]
    paths: ['docs/images/*.mmd', 'docs/images/*.png', 'docs/*.md', 'book.yaml', 'requirements.txt']
  push:
    branches: [main]
    paths: ['docs/images/*.mmd', 'docs/images/*.png', 'docs/*.md', 'book.yaml', 'requirements.txt']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  readable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Lets pip read the private repositories of the organisation when the secret GEONITAB_READ_TOKEN exists.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.${{ secrets.GEONITAB_READ_TOKEN && format('https://x-access-token:{0}@github.com/Geonitab/', secrets.GEONITAB_READ_TOKEN) || 'https://github.com/Geonitab/' }}.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/Geonitab/
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the engine
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Measure the diagrams
        run: bookengine run validate_diagram_readability
