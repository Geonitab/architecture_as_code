# Inlined from Geonitab/book-engine/.github/workflows/validate-numbering.yml@d9576bb: this repository is public and cannot call the organisation's internal reusable workflows.
name: Validate Chapter Numbering

on:
  pull_request:
    branches: [main]
    paths: ['docs/*.md']
  push:
    branches: [main]
    paths: ['docs/*.md']
  workflow_dispatch: {}

permissions:
  contents: read


jobs:
  numbering-check:
    runs-on: ubuntu-latest
    env:
      # Lets pip and git read the private repositories of the organisation when the secret GEONITAB_READ_TOKEN exists.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.${{ secrets.GEONITAB_READ_TOKEN && format('https://x-access-token:{0}@github.com/Geonitab/', secrets.GEONITAB_READ_TOKEN) || 'https://github.com/Geonitab/' }}.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/Geonitab/
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: 📦 Install the book engine and the book's dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: 🔍 Validate chapter numbering
        run: bookengine run check_doc_numbering
