name: Unified Build & Release

on:
  push:
    branches: [main]
    paths: ['docs/**', 'book.yaml', 'requirements.txt', 'templates/**', 'package.json', 'package-lock.json']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'book.yaml', 'requirements.txt', 'templates/**']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: true
      deliverables:
        description: 'Deliverables to build'
        type: choice
        default: all
        options: [all, book-only, presentations-only, whitepapers-only]

permissions:
  contents: write

jobs:
  release:
    uses: Geonitab/book-engine/.github/workflows/build-release.yml@81ca5e6a978294cf622a0f7457f5a0446782644c
    with:
      deliverables: ${{ inputs.deliverables || 'all' }}
      create_release: ${{ inputs.create_release != false }}
      engine_ref: 81ca5e6a978294cf622a0f7457f5a0446782644c
    secrets: inherit
