# Inlined from Geonitab/book-engine/.github/workflows/build-release.yml@d9576bb: this repository is public and cannot call the organisation's internal reusable workflows.
name: Unified Build & Release

on:
  push:
    branches: [main]
    paths: ['docs/**', 'book.yaml', 'requirements.txt', 'templates/**', 'package.json', 'package-lock.json']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'book.yaml', 'requirements.txt', 'templates/**']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: true
      deliverables:
        description: 'Deliverables to build'
        type: choice
        default: all
        options: [all, book-only, presentations-only, whitepapers-only]

permissions:
  contents: write

env:
  PANDOC_VERSION: "3.1.9"
  ARTIFACT_RETENTION_DAYS: 30


jobs:
  # Determine build strategy based on inputs or defaults
  setup:
    name: 🔧 Setup Build Strategy
    runs-on: ubuntu-latest
    env:
      # Lets pip and git read the private repositories of the organisation when the secret GEONITAB_READ_TOKEN exists.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.${{ secrets.GEONITAB_READ_TOKEN && format('https://x-access-token:{0}@github.com/Geonitab/', secrets.GEONITAB_READ_TOKEN) || 'https://github.com/Geonitab/' }}.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/Geonitab/
    timeout-minutes: 5
    outputs:
      run_docker: ${{ steps.strategy.outputs.run_docker }}
      build_deliverables: ${{ steps.strategy.outputs.build_deliverables }}
    steps:
      - name: 📋 Determine build strategy
        id: strategy
        run: |
          echo "run_docker=true" >> $GITHUB_OUTPUT
          echo "build_deliverables=${{ inputs.deliverables || 'all' }}" >> $GITHUB_OUTPUT

  # Docker-optimized build (equivalent to build-book-fast.yml)
  docker-build:
    name: 🐳 Docker Optimized Build
    runs-on: ubuntu-latest
    env:
      # Lets pip and git read the private repositories of the organisation when the secret GEONITAB_READ_TOKEN exists.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.${{ secrets.GEONITAB_READ_TOKEN && format('https://x-access-token:{0}@github.com/Geonitab/', secrets.GEONITAB_READ_TOKEN) || 'https://github.com/Geonitab/' }}.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/Geonitab/
    timeout-minutes: 60
    needs: setup
    if: needs.setup.outputs.run_docker == 'true'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 📥 Checkout the book engine (Dockerfile)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ 'Geonitab/book-engine' }}
          ref: ${{ 'd9576bb98b10293e5fa8abf92c20855095143641' }}
          token: ${{ secrets.GEONITAB_READ_TOKEN || github.token }}
          path: .engine

      - name: 📖 Read book.yaml
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import yaml
          c = yaml.safe_load(open("book.yaml"))
          print(f"SLUG={c['slug']}")
          print(f"BOOK_TITLE={c['title']}")
          name = c.get('series_name', 'The Transformed Architecture')
          label = c.get('series_label') or (f"{name}, Book {c['series_position']}" if c.get('kind', 'book') == 'book' else f"A companion to {name}")
          print(f"SERIES_LABEL={label}")
          PY

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 🐍 Set up Python (for content generation)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔧 Set up Node.js (for website build)
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: ⚠️ Skip Node.js setup (no lockfile)
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: |
          echo "No package-lock.json detected – skipping Node.js setup for Docker build."

      - name: 📦 Build Docker image with cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .engine/src/bookengine/data/Dockerfile.book-builder
          tags: unified-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: 📦 Install Node.js dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          echo "=== Installing Node.js dependencies ==="
          npm ci --legacy-peer-deps
          echo "✅ Node.js dependencies installed"

      - name: ⚠️ Skip Node.js dependency installation (no lockfile)
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: |
          echo "Skipping npm ci because package-lock.json is missing for Docker build."

      - name: 📝 Generate book content
        run: |
          echo "=== Generating book content ==="
          bookengine generate-book
          echo "✅ Book content generated"

      - name: 🌐 Skip website build
        run: |
          echo "=== Skipping website build (no frontend available) ==="

      - name: 🏗️ Build all formats in Docker container
        run: |
          echo "=== Building all deliverables in Docker container ==="

          # Create release directory structure
          echo "📁 Creating release directory structure..."
          mkdir -p releases/{book,presentation,whitepapers,website}
          echo "✅ Release directories created:"
          ls -la releases/

          # Check what deliverables to build
          DELIVERABLES="${{ needs.setup.outputs.build_deliverables }}"
          echo "🎯 Building deliverables: $DELIVERABLES"

          # Build using Docker with proper Chrome configuration
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable \
            -e CHROME_FLAGS="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage" \
            unified-builder:latest \
            bash -c "
              echo '=== Running Docker-based unified build ===' &&
              cd /workspace &&
              export PYTHONPATH=/workspace/.engine/src &&
              python3 -c 'import bookengine; print("bookengine", bookengine.__version__)' &&
              (grep -v -e '^#' -e '^geon-book-engine' -e '^$' requirements.txt > /tmp/book-extras.txt; [ -s /tmp/book-extras.txt ] && python3 -m pip install -q -r /tmp/book-extras.txt || true) &&

              case '$DELIVERABLES' in
                'book-only')
                  echo '📖 Building book formats only...' &&
                  echo '📝 Step 1: Generating EPUB content...' &&
                  python3 -m bookengine generate-book --format epub --output dist/book.epub --all &&
                  test -s dist/book.epub &&
                  echo '📝 Step 2: Building book formats...' &&
                  python3 -m bookengine build --release &&
                  echo '📝 Step 3: Verifying book files...' &&
                  ls -la releases/book/${SLUG}.pdf || { echo '❌ PDF missing from releases/book/ – aborting'; exit 1; }
                  ;;
                'presentations-only')
                  echo '🎤 Building presentations only...' &&
                  python3 -m bookengine presentation --release --create-pptx &&
                  echo '📝 Verifying presentation files...' &&
                  ls -la releases/presentation/ || echo '⚠️ No presentation files found'
                  ;;
                'whitepapers-only')
                  echo '📄 Building whitepapers only...' &&
                  python3 -m bookengine whitepapers --release &&
                  echo '📝 Verifying whitepaper files...' &&
                  ls -la releases/whitepapers/ || echo '⚠️ No whitepaper files found'
                  ;;
                'website-only')
                  echo '🌐 Skipping website build (no frontend available)...'
                  ;;
                'all'|*)
                  echo '📦 Building all deliverables...' &&
                  # Build book in all formats
                  echo '📖 Step 1: Building book formats...' &&
                  echo '📝 Generating EPUB content...' &&
                  python3 -m bookengine generate-book --format epub --output dist/book.epub --all &&
                  test -s dist/book.epub &&
                  python3 -m bookengine build --release &&
                  echo '📝 Verifying book files...' &&
                  ls -la releases/book/${SLUG}.pdf || { echo '❌ PDF missing from releases/book/ – aborting'; exit 1; } &&

                  # Generate whitepapers
                  echo '📄 Step 2: Generating whitepapers...' &&
                  python3 -m bookengine whitepapers --release &&
                  echo '📝 Verifying whitepaper files...' &&
                  ls -la releases/whitepapers/ || echo '⚠️ No whitepaper files found' &&

                  # Generate presentations
                  echo '🎤 Step 3: Generating presentations...' &&
                  python3 -m bookengine presentation --release --create-pptx &&
                  python --version &&
                  python3 --version &&
                  echo '📝 Verifying presentation files...' &&
                  ls -la releases/presentation/ || echo '⚠️ No presentation files found'
                  ;;
              esac &&

              echo '✅ Docker-based build completed' &&
              echo '📁 Final directory structure:' &&
              find releases/ -type d | sort &&
              echo '📄 Final file count:' &&
              find releases/ -type f | wc -l
            "

      - name: 📄 Generate combined whitepapers PDF
        run: |
          echo "=== Generating combined whitepapers PDF ==="

          # Check if whitepaper HTML files exist
          if ! ls releases/whitepapers/*.html 1>/dev/null 2>&1; then
            echo "⚠️ No whitepaper HTML files found, skipping combined PDF generation"
            exit 0
          fi

          echo "Found $(ls releases/whitepapers/*.html | wc -l) whitepaper HTML files"

          # Use the already-built Docker image (has Pandoc + XeLaTeX) to generate combined PDF
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            unified-builder:latest \
            bash -c '
              rm -f /tmp/combined_wp.md
              for f in releases/whitepapers/*.html; do
                [ -f "$f" ] || continue
                fname=$(basename "$f" .html)
                echo "Processing: $fname"
                echo "## $fname" >> /tmp/combined_wp.md
                echo "" >> /tmp/combined_wp.md
                grep -A 99999 "<body" "$f" | grep -B 99999 "</body" | sed "s/<[^>]*>//g" | sed "/^[[:space:]]*$/d" >> /tmp/combined_wp.md || true
                echo "" >> /tmp/combined_wp.md
                printf -- "---\n\n" >> /tmp/combined_wp.md
              done
              if [ -s /tmp/combined_wp.md ]; then
                echo "Generating combined PDF with Pandoc + XeLaTeX..."
                pandoc /tmp/combined_wp.md \
                  -o releases/whitepapers/whitepapers_combined.pdf \
                  --pdf-engine=xelatex \
                  -V geometry:margin=1in \
                  --toc \
                  && echo "✅ Combined whitepaper PDF generated" \
                  || { echo "❌ Pandoc PDF generation failed"; exit 1; }
                rm -f /tmp/combined_wp.md
              else
                echo "❌ No content extracted from whitepaper HTML files"
                exit 1
              fi
            '

          # Fix ownership (Docker may write files as root)
          sudo chown -R $(id -u):$(id -g) releases/whitepapers/ || true

          echo "✅ Combined PDF created:"
          ls -lh releases/whitepapers/whitepapers_combined.pdf

      - name: 🌐 Skip website copy
        run: |
          echo "=== Skipping website copy (no website build artifacts) ==="

      - name: 🔍 Verify files were created (Docker)
        run: |
          echo "=== Verifying Docker build output files ==="
          
          # Fix ownership issues that might occur with Docker
          sudo chown -R $(id -u):$(id -g) releases/ || true
          
          echo "📁 Release directory structure:"
          find releases/ -type d | sort
          
          echo ""
          echo "📄 All files in releases directory:"
          find releases/ -type f | sort
          
          echo ""
          echo "📊 File count by directory:"
          for dir in releases/*/; do
            if [ -d "$dir" ]; then
              count=$(find "$dir" -type f | wc -l)
              echo "  $(basename "$dir"): $count files"
            fi
          done
          
          echo ""
          echo "🔍 Checking for expected key files:"
          
          # Check for book files
          if [ -f "releases/book/${SLUG}.pdf" ]; then
            echo "✅ Book PDF found ($(ls -lh releases/book/${SLUG}.pdf | awk '{print $5}'))"
          else
            echo "❌ Book PDF not found"
          fi
          
          # Check for presentation files
          presentation_files=$(find releases/presentation -name "*.md" -o -name "*.py" -o -name "*.txt" -o -name "*.pptx" 2>/dev/null | wc -l)
          if [ "$presentation_files" -gt 0 ]; then
            echo "✅ Presentation materials found ($presentation_files files)"
          else
            echo "❌ No presentation materials found"
          fi
          
          # Check for whitepaper files
          whitepaper_files=$(find releases/whitepapers -name "*.html" -o -name "*.pdf" 2>/dev/null | wc -l)
          if [ "$whitepaper_files" -gt 0 ]; then
            echo "✅ Whitepaper files found ($whitepaper_files files)"
          else
            echo "❌ No whitepaper files found"
          fi
          
          # Check for website files
          website_files=$(find releases/website -type f 2>/dev/null | wc -l)
          if [ "$website_files" -gt 0 ]; then
            echo "✅ Website files found ($website_files files)"
          else
            echo "❌ No website files found"
          fi

      - name: 📊 Docker build summary
        run: |
          echo "=== Docker-based Build Summary ==="

          echo "📚 Book formats:"
          if [ -d "releases/book" ]; then
            ls -la releases/book/ || echo "   No book files found"
            if [ -f "releases/book/${SLUG}.pdf" ]; then
              echo "   📖 PDF size: $(ls -lh releases/book/${SLUG}.pdf | awk '{print $5}')"
            fi
          fi

          echo ""
          echo "🎤 Presentation materials:"
          if [ -d "releases/presentation" ]; then
            ls -la releases/presentation/ || echo "   No presentation files found"
          fi

          echo ""
          echo "📄 Whitepapers:"
          if [ -d "releases/whitepapers" ]; then
            whitepaper_count=$(ls releases/whitepapers/*.html 2>/dev/null | wc -l || echo "0")
            echo "   $whitepaper_count HTML whitepaper files"
            if [ -f "releases/whitepapers/whitepapers_combined.pdf" ]; then
              echo "   ✅ Combined PDF generated"
            fi
          fi

          echo ""
          echo "🌐 Website:"
          if [ -d "releases/website" ] && [ "$(ls -A releases/website)" ]; then
            website_files=$(find releases/website -type f | wc -l)
            echo "   $website_files files copied to releases/website/"
          else
            echo "   No website files found"
          fi

          echo ""
          echo "📁 Total release size: $(du -sh releases/ | awk '{print $1}')"
          echo "🐳 Docker-based build completed at: $(date)"

      - name: 📤 Upload docker build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: unified-docker-build
          path: releases/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # Combine results and create unified release
  finalize:
    name: 📦 Finalize & Release
    runs-on: ubuntu-latest
    env:
      # Lets pip and git read the private repositories of the organisation when the secret GEONITAB_READ_TOKEN exists.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.${{ secrets.GEONITAB_READ_TOKEN && format('https://x-access-token:{0}@github.com/Geonitab/', secrets.GEONITAB_READ_TOKEN) || 'https://github.com/Geonitab/' }}.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/Geonitab/
    permissions:
      contents: write  # creates the GitHub release
    timeout-minutes: 15
    needs: [setup, docker-build]
    if: always() && needs.docker-build.result == 'success'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🐍 Set up Python (to read book.yaml)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: 📦 PyYAML
        run: pip install pyyaml

      - name: 📖 Read book.yaml
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import yaml
          c = yaml.safe_load(open("book.yaml"))
          print(f"SLUG={c['slug']}")
          print(f"BOOK_TITLE={c['title']}")
          name = c.get('series_name', 'The Transformed Architecture')
          label = c.get('series_label') or (f"{name}, Book {c['series_position']}" if c.get('kind', 'book') == 'book' else f"A companion to {name}")
          print(f"SERIES_LABEL={label}")
          PY

      - name: 📦 Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unified-docker-build
          path: artifacts/unified-docker-build

      - name: 🔄 Merge build results
        run: |
          echo "=== Merging build results ==="
          mkdir -p final-release/{book,presentation,whitepapers,website}

          echo "📋 Available artifacts:"
          ls -la artifacts/ || echo "No artifacts directory found"
          
          if [ -d "artifacts" ]; then
            find artifacts/ -type d | sort
            echo ""
            echo "📄 Artifact contents:"
            find artifacts/ -type f | sort
          fi

          # Use docker build results
          if [ -d "artifacts/unified-docker-build" ]; then
            echo "🐳 Using docker build results"
            echo "📄 Docker build contents:"
            find artifacts/unified-docker-build/ -type f | sort
            cp -r artifacts/unified-docker-build/* final-release/
          else
            echo "❌ No successful build artifacts found"
            echo "Available directories in artifacts/:"
            ls -la artifacts/ 2>/dev/null || echo "No artifacts directory exists"
            exit 1
          fi

          echo "✅ Build results merged from docker build"
          echo ""
          echo "📁 Final release structure:"
          find final-release -type d | sort
          echo ""
          echo "📄 Final release files:"
          find final-release -type f | sort
          echo ""
          echo "📊 Final file counts:"
          for dir in final-release/*/; do
            if [ -d "$dir" ]; then
              count=$(find "$dir" -type f | wc -l)
              echo "  $(basename "$dir"): $count files"
            fi
          done

      - name: 📤 Upload individual components
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: book-formats-unified
          path: final-release/book/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

      - name: 📤 Upload presentation materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: presentation-materials-unified
          path: final-release/presentation/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

      - name: 📤 Upload whitepapers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: whitepapers-unified
          path: final-release/whitepapers/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

      - name: 📤 Upload website build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: website-build-unified
          path: final-release/website/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

      - name: 📦 Create complete release archive
        if: success()
        run: |
          echo "=== Creating complete release archive ==="
          cd final-release
          zip -r ../${SLUG}_release.zip .
          cd ..
          echo "✅ Complete release archive created"
          ls -lh ${SLUG}_release.zip

      - name: 📤 Upload complete release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: unified-release-archive
          path: ${{ env.SLUG }}_release.zip
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: 🚀 Create comprehensive GitHub Release
        # A comprehensive release lists every format as a required asset, so it is only created for full builds
        if: (github.event_name != 'workflow_dispatch' || inputs.create_release) && (inputs.deliverables || 'all') == 'all' && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ github.run_number }}-unified
          name: "${{ env.BOOK_TITLE }} v${{ github.run_number }} - Unified Release"
          body: |
            📚 **${{ env.BOOK_TITLE }} (${{ env.SERIES_LABEL }}) - Unified Complete Release**

            Generated from commit: ${{ github.sha }}

            **🔄 Unified Build Process**

            This release was generated using the new unified workflow that consolidates:
            - ✅ Complete release functionality (all formats)
            - ✅ Docker-optimized builds with caching
            - ✅ Standalone presentations and whitepapers

            ### 📦 Complete Release Package Contents:

            #### 📖 Book Formats
            - `${{ env.SLUG }}.pdf` - Complete PDF book
            - `${{ env.SLUG }}.epub` - EPUB format for e-readers
            - `${{ env.SLUG }}.docx` - Microsoft Word format

            #### 🎤 Presentation Materials
            - `${{ env.SLUG }}_presentation.pptx` - PowerPoint presentation
            - Presentation outline and generation scripts

            #### 📄 Whitepapers
            - Individual HTML whitepapers for each chapter
            - `whitepapers_combined.pdf` - All whitepapers in single PDF

            **🛠️ Build Information:**
            - Built with unified workflow (replaces 3 separate workflows)
            - Pandoc ${{ env.PANDOC_VERSION }} with XeLaTeX PDF-engine
            - Docker optimization for faster builds
            - Mermaid diagrams converted to PNG
            - Website generation skipped (frontend not available)
            - Python-generated presentations and whitepapers

            **📥 Download Options:**
            - Individual components from Assets below
            - `${{ env.SLUG }}_release.zip` - All deliverables in one archive

            🎯 **This unified release includes ALL project deliverables with optimized build performance!**
          files: |
            final-release/book/${{ env.SLUG }}.pdf
            final-release/book/${{ env.SLUG }}.epub
            final-release/book/${{ env.SLUG }}.docx
            final-release/presentation/${{ env.SLUG }}_presentation.pptx
            final-release/whitepapers/whitepapers_combined.pdf
            ${{ env.SLUG }}_release.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
