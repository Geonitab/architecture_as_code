name: Claude issue planner

on:
  issues:
    types:
      - opened
      - labeled

permissions:
  contents: read
  issues: write

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ensure-labels:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Create Claude labels if missing
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const labels = [
              { name: 'claude:queued', color: '1d76db', description: 'Queue issue for Claude planning' },
              { name: 'claude:running', color: 'fbca04', description: 'Claude is working on this issue' },
              { name: 'claude:plan-review', color: 'c5def5', description: 'Claude plan is ready for review' },
              { name: 'claude:approved', color: '0e8a16', description: 'Approve creation of child issues from the Claude plan' },
              { name: 'claude:children-created', color: '5319e7', description: 'Child issues have been created' },
              { name: 'claude:failed', color: 'd73a4a', description: 'Claude workflow failed' }
            ];
            for (const label of labels) {
              await github.rest.issues.createLabel({ owner, repo, ...label }).catch(error => { if (error.status !== 422) throw error; });
            }
            const createdFromApprovedPlan = (issue.body || '').includes('Created from an approved Claude plan.');
            if (context.payload.action === 'opened' && !createdFromApprovedPlan) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['claude:queued'] });
            }

  plan:
    needs: ensure-labels
    if: >-
      !github.event.issue.pull_request &&
      ((github.event.action == 'opened' && !contains(github.event.issue.body, 'Created from an approved Claude plan.')) ||
       (github.event.action == 'labeled' && github.event.label.name == 'claude:queued'))
    uses: Geonitab/Internal/.github/workflows/claude-issue-planner-reusable.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      issue_body: ${{ github.event.issue.body || '' }}
    secrets: inherit