# Inlined from Geonitab/book-engine/.github/workflows/build-site.yml@d9576bb: this repository is public and cannot call the organisation's internal reusable workflows.
name: Build MkDocs Site

on:
  push:
    paths: ['docs/**', 'mkdocs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mkdocs-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    env:
      # Lets pip and git read the private repositories of the organisation when the secret GEONITAB_READ_TOKEN exists.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.${{ secrets.GEONITAB_READ_TOKEN && format('https://x-access-token:{0}@github.com/Geonitab/', secrets.GEONITAB_READ_TOKEN) || 'https://github.com/Geonitab/' }}.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/Geonitab/
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install MkDocs and bootswatch theme
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mkdocs pymdown-extensions mkdocs-bootswatch mkdocs-redirects

      - name: Build MkDocs site
        run: bookengine site build 

      - name: Prepare static site artifacts
        run: |
          if [ -f CNAME ]; then
            cp CNAME site/CNAME
          fi
          touch site/.nojekyll

      - name: Deploy MkDocs site to GitHub Pages
        # Only main publishes the live site; other branches and pull requests just build.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git fetch
          git switch -C gh-pages
          git rm -rf . || true
          cp -r site/. .
          git add .
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy MkDocs site"
          git push origin gh-pages --force